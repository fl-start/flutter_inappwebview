# Canonical flutter_inappwebview pins for secMail (scomm_ai).
# Mirror these refs in secMail3/pubspec.yaml (dependencies + dependency_overrides).
# All tiers track master; pubspec.lock records the resolved commit.
#
# Verify from secMail: ./scripts/verify_inappwebview_pins.sh

repository: https://github.com/fl-start/flutter_inappwebview.git

shared:
  ref: master
  packages:
  - name: flutter_inappwebview
    path: flutter_inappwebview
  - name: flutter_inappwebview_platform_interface
    path: flutter_inappwebview_platform_interface
  - name: flutter_inappwebview_internal_annotations
    path: dev_packages/flutter_inappwebview_internal_annotations
  - name: flutter_inappwebview_web
    path: flutter_inappwebview_web

linux:
  ref: master
  packages:
  - name: flutter_inappwebview_linux_webkitgtk
    path: flutter_inappwebview_linux_webkitgtk

windows:
  ref: master
  packages:
  - name: flutter_inappwebview_windows
    path: flutter_inappwebview_windows

macos:
  ref: master
  packages:
  - name: flutter_inappwebview_macos
    path: flutter_inappwebview_macos

android:
  ref: master
  packages:
  - name: flutter_inappwebview_android
    path: flutter_inappwebview_android

ios:
  ref: master
  packages:
  - name: flutter_inappwebview_ios
    path: flutter_inappwebview_ios
